[package]
name = "dictate"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dictate"
path = "src/main.rs"

[dependencies]
whisper-rs = "0.16"
cpal = "0.17"
rdev = "0.5"
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = []
cuda = ["whisper-rs/cuda"]
